name: docs
on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
jobs:
  release:
    permissions:
      contents: write
    uses: nimbase/setup-nim-action/.github/workflows/docs.yml@main
    with:
      pre-install-command: 'sudo apt-get update && sudo apt-get install -y libjavascriptcoregtk-4.1-dev libssl-dev'
